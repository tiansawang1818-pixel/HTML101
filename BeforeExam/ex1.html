<!--📋 ข้อกำหนดของหน้าเว็บที่คุณต้องเขียน (Specification)
ให้เขียนไฟล์ HTML 1 ไฟล์ โดยต้องมีองค์ประกอบและใช้คำสั่งตามที่กำหนดดังนี้:
1. โครงสร้างหลัก (Global Structure)
ต้องประกาศประเภทเอกสารให้ถูกต้องเป็นอันดับแรก.
ต้องเขียนโครงสร้างหลักให้ครบถ้วน: มีแท็กครอบคลุมทั้งหมด และแบ่งส่วนหัวกับส่วนเนื้อหาหลักอย่างชัดเจน.
ในส่วนหัวข้อหลังบ้าน ให้ตั้งชื่อ Title ของหน้าเว็บว่า "ประวัติของ [ชื่อตัวละคร]".
ให้ใส่ Comment บอกชื่อของคุณและวันที่เขียนไว้ที่บรรทัดบนสุดของโค้ด.
2. ส่วนหัวเรื่องและการแนะนำตัว (Headings & Paragraphs)
ใช้คำสั่ง Heading ขนาดใหญ่ที่สุด เพื่อแสดงชื่อของตัวละคร.
เขียนอธิบายตัวละครสั้น ๆ เป็นย่อหน้า โดยข้อกำหนดคือ:
ให้ใช้แท็กสำหรับขึ้นบรรทัดใหม่ในย่อหน้าเพื่อจัดระเบียบข้อความ.
ให้ใช้อักขระพิเศษ (Character Entity) คือ &nbsp; ร่วมด้วย เพื่อสร้างการเว้นวรรคช่องว่างคงที่ในประโยคแนะนำตัว.
3. ส่วนข้อมูลจำเพาะ (Table)
สร้างตารางแสดงข้อมูลจำเพาะของตัวละครมา 1 ตาราง (กำหนดให้มีเส้นขอบตารางด้วย):
ต้องมีแถวบนสุดเป็นหัวข้อตาราง เช่น "คุณสมบัติ" และ "รายละเอียด".
ต้องมีแถวข้อมูลปกติอย่างน้อย 2 แถว.
4. ส่วนกิจกรรมหรือสิ่งที่ชอบ (Lists)
ใช้รายการข้อความแบบไม่มีลำดับ (Unordered List) หรือ แบบมีลำดับ (Ordered List) เพื่อแสดงรายการสิ่งที่ชอบหรือความสามารถพิเศษของตัวละครนั้นมาอย่างน้อย 3 ข้อ.
5. ส่วนภาพประกอบและลิงก์เชื่อมโยง (Images & Links)
ใส่รูปภาพของตัวละครมา 1 รูป (สามารถหาลิงก์รูปภาพจากอินเทอร์เน็ตมาใส่ได้).
ห้ามลืม: ใส่คำอธิบายรูปภาพผ่าน Attribute สำหรับกลุ่มผู้พิการทางสายตา.
ทำให้รูปภาพนี้สามารถคลิกได้ (Clickable Image) โดยเมื่อคลิกที่รูปภาพแล้ว จะต้องลิงก์ไปยังเว็บไซต์ที่เป็นทางการของตัวละครนั้น หรือเว็บไซต์ Google (Absolute Path).
สร้างลิงก์สำหรับส่งอีเมลติดต่อหาคุณ (ผู้สร้างหน้าเว็บ) ไว้ท้ายหน้าเพจ.-->
