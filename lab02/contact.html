    <h1> Contact </h1>
    <form action="contact.html" method="GET">
    <fieldset>

        <legend>Your Personal Information</legend>

        <label for="fname">Your first name:</label >  
        <input type="text" id="fname" name="Ufname" required><br>

        <label for="lname">Your last name:</label>
        <input type="text" id="lname" name="Ulname" required><br>

        <label for="Uemail">Your email:</label>
        <input type="email" id="Uemail" name="UUemail" required><br>

        <label for="no">Your mobile:</label>
        <input type="tel" id="no" name="Uno" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="xxx-xxx-xxxx" ><br>

        <label for="mes">Message:</label><br>
        <textarea style="width: 100%; height: 120px;" id="mes" name="Message" required ></textarea><br>
        
        <button type="submit">Submit</button>
        <button type="reset">Clear</button>

    </fieldset>
    </form>
